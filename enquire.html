<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enquire — Aiva Wellness</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css" />
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <style>
      body {
        font-family: Inter, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 40px;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        background: #fff;
        padding: 28px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(8, 13, 20, 0.06);
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        text-decoration: none;
        color: inherit;
      }
      .brand-mark {
        width: 48px;
        height: 48px;
      }
      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      h1 {
        margin: 8px 0 18px 0;
      }
      label {
        font-weight: 600;
        font-size: 0.9rem;
      }
      .btn-enquire {
        background: linear-gradient(135deg, #1d4ed8, #2563eb);
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
      }
      .muted {
        color: #64748b;
        font-size: 0.9rem;
      }
      /* Premium secondary button — professional navy gradient */
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 10px;
        background: linear-gradient(90deg, #0b3d91, #1d4ed8);
        color: #fff;
        font-weight: 700;
        border: none;
        box-shadow: 0 12px 30px rgba(11, 61, 145, 0.12);
        transition:
          transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.22s,
          opacity 0.22s,
          text-decoration 0.2s;
      }
      .btn-secondary:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 42px rgba(11, 61, 145, 0.18);
        opacity: 0.98;
      }
      .btn-secondary:active {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(11, 61, 145, 0.08);
      }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Brand",
        "name": "Aiva Wellness",
        "alternateName": "Aiva Wellness India",
        "logo": "https://aivawellness.in/assets/logo.png",
        "description": "Premium science-backed healthcare and wellness supplements including Nattokinase and Magnesium Complex.",
        "slogan": "Science-backed formulas for everyday wellness"
      }
    </script>
      <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7JEHMZBFMB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-7JEHMZBFMB");
    </script>
</head>
  <body>
    <main class="container">
      <a class="brand" href="/">
        <div class="brand-mark">
          <img src="assets/logo.png" alt="Aiva Wellness logo" />
        </div>
        <div>
          <div style="font-weight: 700">Aiva Wellness</div>
          <div class="muted">Premium Healthcare &amp; Wellness</div>
        </div>
      </a>

      <h1>Enquire Now</h1>
      <p class="muted">
        Fill the form below and our team will get back to you shortly.
      </p>

      <form
        action="mailto:info@aivawellness.in"
        method="post"
        enctype="text/plain"
      >
        <div style="margin-top: 16px">
          <label for="name">Name</label><br />
          <input
            id="name"
            name="Name"
            required
            style="
              width: 100%;
              padding: 10px;
              margin-top: 6px;
              border-radius: 8px;
              border: 1px solid #e6e9ef;
            "
          />
        </div>
        <div style="margin-top: 12px">
          <label for="email">Email</label><br />
          <input
            id="email"
            type="email"
            name="Email"
            required
            style="
              width: 100%;
              padding: 10px;
              margin-top: 6px;
              border-radius: 8px;
              border: 1px solid #e6e9ef;
            "
          />
        </div>
        <div style="margin-top: 12px">
          <label for="message">Message</label><br />
          <textarea
            id="message"
            name="Message"
            rows="6"
            required
            style="
              width: 100%;
              padding: 10px;
              margin-top: 6px;
              border-radius: 8px;
              border: 1px solid #e6e9ef;
            "
          ></textarea>
        </div>
        <div
          style="margin-top: 16px; display: flex; gap: 8px; align-items: center"
        >
          <button type="submit" class="btn-enquire">Send Enquiry</button>
          <a class="btn-secondary" href="/">Back to Home</a>
        </div>
      </form>
    </main>
  </body>
</html>
